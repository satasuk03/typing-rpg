name = "hd2d-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Local-only D1 for now. Replace database_id when a real database is provisioned.
[[d1_databases]]
binding = "DB"
database_name = "hd2d"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Local-only KV for the top-100 leaderboard cache (rebuilt by cron / on top-100 entry).
[[kv_namespaces]]
binding = "LB_CACHE"
id = "00000000000000000000000000000000"

# Rebuild the KV top-100 every minute (interfaces §10 / plan T5.2).
[triggers]
crons = ["* * * * *"]

# Workers Rate Limiting binding (period must be 10 or 60). Keyed per IP (auth) or per user (save, runs).
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_SAVE"
namespace_id = "1002"
simple = { limit = 2, period = 60 }

[[ratelimits]]
name = "RL_RUN"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_LB"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# NOTE: wrangler does NOT inherit bindings, [vars], [triggers] or [[ratelimits]] into [env.*] sections. If you add one
# (e.g. [env.production]), you MUST repeat every [[d1_databases]], [[kv_namespaces]], [triggers], [vars] and all four
# [[ratelimits]] blocks (RL_AUTH, RL_SAVE, RL_RUN, RL_LB) inside it. A missing rate-limit binding fails CLOSED
# (HTTP 500) unless RATE_LIMIT_DISABLED=1 is set, so a forgotten mirror is loud, not silent.
#
# Non-secret config. Secrets (JWT_SECRET, TICKET_SECRET) come from `wrangler secret put` / .dev.vars (see .dev.vars.example).
# AC_* thresholds: interfaces §10. IKI-based ones are PROVISIONAL: tune on real data before the season starts.
[vars]
SEASON_KEY = "S1"
# CORS allowlist (exact origins, comma separated). Production must list the real game origin(s) only.
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
AC_RUN_TTL_MS = "600000"
AC_CLOCK_SLACK_MS = "5000"
AC_MAX_SUSTAINED_WPM = "220"
AC_SUSTAINED_SPAN_MS = "30000"
AC_MAX_BURST_WPM = "300"
AC_BURST_SPAN_MS = "5000"
AC_MIN_IKI_CV = "0.15"
AC_FAST_IKI_MS = "15"
AC_MAX_FAST_IKI_SHARE = "0.02"
AC_QUANT_MIN_PERIOD_MS = "8"
AC_QUANT_MAX_SHARE = "0.6"
AC_MAX_JANK_SHARE = "0.10"
AC_PERFECT_MIN_KEYS = "400"
AC_PERFECT_MIN_WPM = "150"
AC_PB_JUMP_REVIEW_WPM = "35"
AC_MIN_KEYS = "20"
AC_ABANDON_MIN_TICKETS = "8"
AC_ABANDON_MAX_RATE = "0.5"
