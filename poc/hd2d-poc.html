<title>Whispering Woods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one 16:9 stage, centered on a night-forest ground, with a quiet caption strip underneath. Single dark look by choice. */
:root{
  --bg:#0a0d10;
  --panel:#15121c;
  --ink:#ece3cc;
  --muted:#8f8a7c;
  --gold:#f2c35b;
  --ember:#ff8a3d;
  --line:#3a3046;
  --pixel:"Press Start 2P","Silkscreen",ui-monospace,Menlo,monospace;
  --ui:"Silkscreen","Press Start 2P",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:radial-gradient(ellipse at 50% 30%,#141c1a 0%,var(--bg) 70%) var(--bg);
  color:var(--ink);font-family:var(--ui);margin:0;
  padding-inline:16px;padding-block:14px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  overflow-x:hidden;
}
.stage{
  position:relative;width:min(100%, calc((100dvh - 84px) * 16 / 9));max-width:1600px;
  aspect-ratio:16/9;background:#000;
  box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6);
}
canvas#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ime{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(ellipse at 50% 55%,rgba(8,6,14,.55) 0%,rgba(8,6,14,.15) 60%,rgba(8,6,14,0) 100%);
}
.card{
  text-align:center;padding:clamp(10px,2.4vw,26px) clamp(14px,3.4vw,40px);
  background:rgba(18,13,26,.78);border:2px solid #c9a35b;outline:2px solid #1c1424;
  box-shadow:0 0 0 4px rgba(201,163,91,.18),0 0 40px rgba(255,190,110,.18);
  display:flex;flex-direction:column;gap:clamp(6px,1.2vw,14px);max-width:90%;
}
.card h1{font-family:var(--pixel);font-weight:400;margin:0;font-size:clamp(12px,2.4vw,28px);color:var(--gold);
  text-shadow:0 2px 0 #5a2e10,0 0 18px rgba(255,190,90,.45);letter-spacing:.04em;text-wrap:balance}
.card p{margin:0;font-size:clamp(9px,1.25vw,14px);color:var(--ink);opacity:.85}
.card .go{font-family:var(--pixel);font-size:clamp(9px,1.3vw,15px);color:#fff;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.toggles{position:absolute;right:1.2%;bottom:2.2%;display:flex;gap:6px}
.toggles button{
  font-family:var(--ui);font-size:clamp(8px,1vw,12px);color:var(--ink);cursor:pointer;
  background:rgba(18,13,26,.82);border:2px solid #6b5a7a;padding:4px 8px;letter-spacing:.06em;
}
.toggles button[aria-pressed="true"]{border-color:#c9a35b;color:var(--gold)}
.toggles button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (max-width:640px){.toggles button{padding:2px 4px;border-width:1px}}
.caption{font-size:clamp(10px,1.1vw,13px);color:var(--muted);letter-spacing:.08em;text-align:center;max-width:100%}
.caption b{color:var(--ink);font-weight:400}
@media (prefers-reduced-motion: reduce){.card .go{animation:none}}
</style>

<div class="stage" id="stage">
  <canvas id="game" width="1152" height="648" aria-label="Whispering Woods typing battle"></canvas>
  <input id="ime" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Typing input">
  <div class="toggles">
    <button id="autoBtn" type="button" aria-pressed="true">AUTO</button>
    <button id="fxBtn" type="button" aria-pressed="true">HD-2D ON</button>
  </div>
  <div class="overlay" id="overlay" role="button" tabindex="0" aria-label="Start game">
    <div class="card">
      <h1>Whispering Woods</h1>
      <p>Type the word over a monster to target it. Every correct letter charges your ATB.</p>
      <div class="go">PRESS ANY KEY TO START</div>
    </div>
  </div>
</div>
<div class="caption"><b>A–Z</b> type &nbsp;·&nbsp; <b>ESC</b> drop target &nbsp;·&nbsp; <b>HD-2D</b> button compares raw pixels with the lit scene</div>

function chunkObjs(k) {

  const r = RNG(k * 9301 + 49297), o = [], base = k * 96;

  else if (v < 0.62) o.push({ t: 'pillarC', x: base + 70 });
  if (r() < 0.6) o.push({ t: 'rock', x: base + r() * 90 });

  text('ATB', 42, 33, 5, '#8fe0ff', { f: FS, thin: 1 });
  const full = hero.atb >= 100;
  bar(58, 33, 66, 4, hero.atb / 100, full ? (Math.floor(t * 8) % 2 ? '#fff4b0' : '#ffd25a') : '#9ff0ff', full ? '#ff9a30' : '#2f88e8');
  if (hero.guard > 0) text('GUARD', 104, 2 + 41, 5, '#9fd8ff', { f: FS, thin: 1 });
  // level name
  font(7, FS); const ln = '1-3  WHISPERING WOODS'; const lw = ctx.measureText(ln).width / S + 14;

  const acc = stats.correct + stats.typos ? Math.round(100 * stats.correct / (stats.correct + stats.typos)) : 100;

}

// ---------------------------------------------------------------- input
const overlay = $('overlay'), ime = $('ime'), fxBtn = $('fxBtn'), autoBtn = $('autoBtn');
function setAuto(v) { game.auto = v; autoBtn.setAttribute('aria-pressed', String(v)); autoBtn.textContent = v ? 'AUTO' : 'AUTO OFF'; }
function start() {
  if (game.started) return;
  game.started = true; overlay.hidden = true; setAuto(false);
  stats.correct = 0; stats.typos = 0; stats.time = 0; stats.combo = 0; stats.wpm = 0; target = null;
  try { ime.focus({ preventScroll: true }); } catch (e) { }
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (document.activeElement === fxBtn || document.activeElement === autoBtn) { if (e.key === 'Enter') return; }
  if (!game.started) { if (e.key === 'Tab') return; e.preventDefault(); start(); return; }
  if (e.key === 'Escape') { if (target) { target.typed = 0; target = null; } return; }
  if (e.key.length === 1) {
    e.preventDefault();
    if (game.auto) setAuto(false);
    onChar(e.key.toLowerCase());
  }
});
ime.addEventListener('input', () => { const v = ime.value; ime.value = ''; if (!game.started) { start(); return; } for (const ch of v) onChar(ch.toLowerCase()); });
overlay.addEventListener('click', start);
overlay.addEventListener('touchend', e => { e.preventDefault(); start(); ime.focus(); });
cvs.addEventListener('pointerdown', () => { try { ime.focus({ preventScroll: true }); } catch (e) { } });

// ---------------------------------------------------------------- loop
if (document.fonts) { document.fonts.load('8px "Press Start 2P"'); document.fonts.load('8px "Silkscreen"'); }
let last = performance.now();
function loop(now) {

  update(dt); render();
  requestAnimationFrame(loop);
}
window.__hd2d = { game, hero, stats, get mons() { return mons; }, setFx: v => { fx = v; }, step: (n, dt = 1 / 60) => { for (let i = 0; i < n; i++) update(dt); render(); } };

})();
