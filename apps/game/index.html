<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HD-2D Typing RPG</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        pointer-events: none;
      }
      #no-touch {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #05060a;
        color: #f3e7c0;
        font: 24px/1.4 system-ui, sans-serif;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="gl"></canvas>
      <canvas id="hud"></canvas>
    </div>
    <div id="no-touch">Please use a keyboard.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
